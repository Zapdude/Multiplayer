name: Build workshop

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build workshop
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Run workshop bundler
      run: bash workshop_bundler.sh

    - name: Name Workshop artifact
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

    - name: Upload mod artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Multiplayer-${{ steps.get_version.outputs.VERSION }}
        path: Multiplayer-v*.zip

    # Releases are created by build-beta (or by hand), so only attach when one
    # exists for this tag.
    - name: Attach mod zip to release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" Multiplayer-v*.zip --clobber
        else
          echo "::notice::No release exists for $TAG; the zip is in the workflow artifacts."
        fi
