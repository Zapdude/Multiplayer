name: Build workshop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build workshop
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Dotnet
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
      
    - name: Run workshop bundler
      run: bash workshop_bundler.sh

    - run: mkdir -p output

    - name: Move files
      run: mv Multiplayer/ output/

    - id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT" # github.ref is refs/tags/<tag> here

    - name: Upload mod artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Multiplayer-${{ steps.get_version.outputs.VERSION }}
        path: |
          Multiplayer-v*.zip
          output/
