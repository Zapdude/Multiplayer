name: Build beta

permissions:
  contents: write

env:
  SLN_PATH: Source/

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

jobs:
  build:
    name: Build beta
    runs-on: ubuntu-latest
    env:
        GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Apply fork version
      id: version
      run: |
        bash build/apply-version.sh --hash | tee "$RUNNER_TEMP/version.txt"
        grep -E '^(releaseTag|prerelease)=' "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"

    - name: Install Mod Dependencies
      run: dotnet restore ${{ env.SLN_PATH }}

    - name: Build Mod
      run: dotnet build ${{ env.SLN_PATH }} --configuration Release --no-restore

    - name: Run tests
      run: dotnet test ${{ env.SLN_PATH }}Tests/Tests.csproj --configuration Release --no-build --no-restore

    - name: Publish Server (Windows)
      run: dotnet publish ${{ env.SLN_PATH }}Server/Server.csproj --configuration Release --runtime win-x64 --self-contained false -p:UseAppHost=true -o output/Server/Windows

    - name: Publish Server (Linux)
      run: dotnet publish ${{ env.SLN_PATH }}Server/Server.csproj --configuration Release --runtime linux-x64 --self-contained false -p:UseAppHost=true -o output/Server/Linux

    - name: Add Server Launchers
      run: |
        cat > output/Server/Linux/Server.sh <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
        exec dotnet "$SCRIPT_DIR/Server.dll" "$@"
        EOF

        chmod +x output/Server/Linux/Server.sh

    - name: Package files
      run: |
        sed -i "s/<name>\(.*\)<\/name>\$/<name>\1 [Continuous]<\/name>/" About/About.xml
        mkdir -p output/Multiplayer
        mv About/ Assemblies/ AssembliesCustom/ Defs/ Languages/ Textures/ output/Multiplayer
        find output/Multiplayer/Languages -mindepth 1 -maxdepth 1 -type f -delete
        cd output/
        zip -r ../Multiplayer-beta.zip Multiplayer/
        zip -r ../Server-beta.zip Server/
        cd ../

    - name: Upload Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Multiplayer-beta
        path: output/
    
    - name: Clean up last release
      continue-on-error: true
      env:
        TAG: ${{ steps.version.outputs.releaseTag }}
      run: |
        gh release delete --cleanup-tag --yes "$TAG"

    - name: Upload new release
      env:
        TAG: ${{ steps.version.outputs.releaseTag }}
        PRERELEASE: ${{ steps.version.outputs.prerelease }}
      run: |
        FLAGS=()
        if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
        gh release create --target "${{ github.sha }}" --title "$TAG" --notes-file "build/notes-for-release.md" --draft "${FLAGS[@]}" "$TAG"
        gh release upload "$TAG" Multiplayer-beta.zip Server-beta.zip
        gh release edit "$TAG" --draft=false
        if [ "$PRERELEASE" != "true" ]; then gh release edit "$TAG" --latest; fi
