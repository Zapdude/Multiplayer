name: Build beta

permissions:
  contents: write
  actions: write

env:
  SLN_PATH: Source/

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-1.7
    paths-ignore:
      - 'README.md'

# Serialize builds of the same branch. A second push waits instead of deleting a
# release the first run is still uploading.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
        GH_TOKEN: ${{ github.token }}
    steps:
    - name: Check release branch
      run: |
        case "$GITHUB_REF" in
          refs/heads/master|refs/heads/experimental-1.7) ;;
          *)
            echo "::error::Releases build only from master or experimental-1.7 (got $GITHUB_REF)"
            exit 1
            ;;
        esac

    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup Dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Apply fork version
      id: version
      run: |
        bash build/apply-version.sh --hash | tee "$RUNNER_TEMP/version.txt"
        grep -E '^(releaseTag|prerelease)=' "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"

    - name: Install Mod Dependencies
      run: dotnet restore ${{ env.SLN_PATH }}

    - name: Build Mod
      run: dotnet build ${{ env.SLN_PATH }} --configuration Release --no-restore

    - name: Run tests
      run: dotnet test ${{ env.SLN_PATH }}Tests/Tests.csproj --configuration Release --no-build --no-restore

    - name: Publish Server (Windows)
      run: dotnet publish ${{ env.SLN_PATH }}Server/Server.csproj --configuration Release --runtime win-x64 --self-contained false -p:UseAppHost=true -o output/Server/Windows

    - name: Publish Server (Linux)
      run: dotnet publish ${{ env.SLN_PATH }}Server/Server.csproj --configuration Release --runtime linux-x64 --self-contained false -p:UseAppHost=true -o output/Server/Linux

    - name: Add Server Launchers
      run: |
        cat > output/Server/Linux/Server.sh <<'EOF'
        #!/usr/bin/env bash
        # Run the server beside this script with the supplied arguments.
        set -euo pipefail
        SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
        exec dotnet "$SCRIPT_DIR/Server.dll" "$@"
        EOF

        chmod +x output/Server/Linux/Server.sh

    - name: Package mod
      run: |
        bash build/package.sh --dest "$RUNNER_TEMP/Multiplayer"
        mkdir -p output
        cp -r "$RUNNER_TEMP/Multiplayer" output/Multiplayer
        bash build/verify-package.sh --dir output/Multiplayer

    - name: Package archives
      run: |
        cd output/
        zip -r ../Multiplayer-beta.zip Multiplayer/
        zip -r ../Server-beta.zip Server/
        cd ../

    - name: Upload Mod Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Multiplayer-beta
        path: output/

    - name: Delete the previous release for this tag
      env:
        TAG: ${{ steps.version.outputs.releaseTag }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release delete --cleanup-tag --yes "$TAG"
        else
          echo "No existing release for $TAG"
        fi

    - name: Upload new release
      env:
        TAG: ${{ steps.version.outputs.releaseTag }}
        PRERELEASE: ${{ steps.version.outputs.prerelease }}
      run: |
        FLAGS=()
        if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
        gh release create --target "${{ github.sha }}" --title "$TAG" --notes-file "build/notes-for-release.md" --draft "${FLAGS[@]}" "$TAG"
        gh release upload "$TAG" Multiplayer-beta.zip Server-beta.zip
        gh release edit "$TAG" --draft=false
        if [ "$PRERELEASE" != "true" ]; then gh release edit "$TAG" --latest; fi
        # Publishing a draft creates the tag through the API, which does not raise a push event,
        # so the workshop build that produces the versioned zip is started explicitly.
        dispatched=false
        for attempt in 1 2 3 4 5; do
          if gh workflow run build-workshop.yml --ref "$TAG"; then dispatched=true; break; fi
          sleep 3
        done
        if [ "$dispatched" != true ]; then
          echo "::error::Could not start the workshop build for $TAG"
          exit 1
        fi
