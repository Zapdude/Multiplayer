name: Build beta

permissions:
  contents: write

env:
  SLN_PATH: Source/

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - personal/dev-integration
    paths-ignore:
      - 'README.md'

jobs:
  build:
    name: Build beta
    runs-on: ubuntu-latest
    env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: continuous-1.6
        RELEASE_TITLE: Continuous-1.6
        VERSIONED_SUFFIX: bodged
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Setup Dotnet
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
      
    - name: Install Mod Dependencies
      run: dotnet restore ${{ env.SLN_PATH }}

    - name: Build Mod
      run: dotnet build ${{ env.SLN_PATH }} --configuration Release --no-restore

    - name: Publish Server (Windows)
      run: dotnet publish ${{ env.SLN_PATH }}Server/Server.csproj --configuration Release --runtime win-x64 --self-contained false -p:UseAppHost=true -o output/Server/Windows

    - name: Publish Server (Linux)
      run: dotnet publish ${{ env.SLN_PATH }}Server/Server.csproj --configuration Release --runtime linux-x64 --self-contained false -p:UseAppHost=true -o output/Server/Linux

    - name: Add Server Launchers
      run: |
        cat > output/Server/Linux/Server.sh <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
        exec dotnet "$SCRIPT_DIR/Server.dll" "$@"
        EOF

        chmod +x output/Server/Linux/Server.sh

    - name: Package files
      run: |
        sed -i "s/<name>\(.*\)<\/name>\$/<name>\1 [Continuous]<\/name>/" About/About.xml
        mkdir -p output/Multiplayer
        mv About/ Assemblies/ AssembliesCustom/ Defs/ Languages/ Textures/ output/Multiplayer
        cd output/
        zip -r ../Multiplayer-beta.zip Multiplayer/
        zip -r ../Server-beta.zip Server/
        cd ../

    - name: Upload Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Multiplayer-beta
        path: output/
    
    - name: Clean up last release
      continue-on-error: true
      run: |
        gh release delete --cleanup-tag --yes "$RELEASE_TAG"

    - name: Upload new release
      run: |
        gh release create --target "${{ github.sha }}" --title "$RELEASE_TITLE" --notes-file ".github/workflows/alpha-notes.md" --draft "$RELEASE_TAG"
        gh release upload "$RELEASE_TAG" Multiplayer-beta.zip Server-beta.zip
        gh release edit "$RELEASE_TAG" --draft=false

    # Versioned releases are dated and keyed on SimpleVersion, so bumping that constant is what
    # moves them. Repeated runs on the same day replace that day's assets instead of adding releases.
    - name: Publish versioned release
      run: |
        VERSION=$(grep -Po '(?<=SimpleVersion = ")[0-9.]+' Source/Common/Version.cs)
        TAG="v${VERSION}-${VERSIONED_SUFFIX}.$(date -u +%Y%m%d)"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" Multiplayer-beta.zip Server-beta.zip --clobber
          gh release edit "$TAG" --title "$TAG" --latest
        else
          gh release create --target "${{ github.sha }}" --title "$TAG" --notes-file ".github/workflows/alpha-notes.md" "$TAG"
          gh release upload "$TAG" Multiplayer-beta.zip Server-beta.zip
          gh release edit "$TAG" --latest
        fi
