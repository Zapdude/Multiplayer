# Based on workflow from https://github.com/krafs/LevelUp

name: Validate Pull Request

permissions:
  contents: read

env:
  SLN_PATH: Source/

on:
  pull_request

jobs:
  builds:
    name: Builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'
      env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: true

    - name: Restore dependencies
      run: dotnet restore ${{ env.SLN_PATH }}

    - name: Build debug
      run: dotnet build ${{ env.SLN_PATH }} --no-restore

    - name: Build release
      run: dotnet build ${{ env.SLN_PATH }} --configuration Release --no-restore

    - name: Run tests
      run: dotnet test "${{ env.SLN_PATH }}Tests/Tests.csproj" --configuration Release --no-build --no-restore
