# Read from the repository's default branch. When personal/dev-integration becomes the
# default branch, these entries maintain both fork branches from one config.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /Source
    target-branch: personal/dev-integration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /Source
    target-branch: experimental-1.7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: personal/dev-integration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: experimental-1.7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
