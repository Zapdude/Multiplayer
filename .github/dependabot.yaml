# Dependabot reads this file from the default branch (master) and maintains
# both fork branches from this single config.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /Source
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /Source
    target-branch: experimental-1.7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: experimental-1.7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
